spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/moliyaviy?stringtype=unspecified
    username: moliyaviy
    password: moliyaviy
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    # Comma-separated list of origins the frontend is served from. The Vite
    # dev server runs on 5173 by default; add the deployed frontend's
    # origin (e.g. https://<frontend>.up.railway.app) via CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
