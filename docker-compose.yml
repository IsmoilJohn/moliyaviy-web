services:
  postgres:
    image: postgres:16-alpine
    container_name: moliyaviy-postgres
    environment:
      POSTGRES_DB: moliyaviy
      POSTGRES_USER: moliyaviy
      POSTGRES_PASSWORD: moliyaviy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moliyaviy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
